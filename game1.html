        // Enhanced Game Sounds using Web Audio API
        function playRocketLaunch() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                const filter = audioContext.createBiquadFilter();
                
                oscillator.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // Rocket launch sound: low rumble building up
                oscillator.frequency.setValueAtTime(80, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.5);
                oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 1.0);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(2000, audioContext.currentTime);
                filter.frequency.exponentialRampToValueAtTime(8000, audioContext.currentTime + 1.0);
                
                gainNode.gain.setValueAtTime(0.4, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1.2);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 1.2);
            } catch (e) {
                console.log('Audio not supported');
            }
        }
        
        function playCorrectChime() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Play a pleasant ascending chime
                [523, 659, 784].forEach((freq, i) => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(freq, audioContext.currentTime + i * 0.1);
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + i * 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.1 + 0.3);
                    
                    oscillator.start(audioContext.currentTime + i * 0.1);
                    oscillator.stop(audioContext.currentTime + i * 0.1 + 0.3);
                });
            } catch (e) {
                console.log('Audio not supported');
            }
        }
        
        function playWrongBuzz() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // Descending buzz for wrong answer
                oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(150, audioContext.currentTime + 0.4);
                oscillator.type = 'sawtooth';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.4);
            } catch (e) {
                console.log('Audio not supported');
            }
        }
        
        function playCrashThud() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Create crash sound with noise and low frequency
                const bufferSize = audioContext.sampleRate * 0.5; // 0.5 seconds
                const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                
                // Generate noise with envelope
                for (let i = 0; i < bufferSize; i++) {
                    const envelope = Math.exp(-i / (bufferSize * 0.1)); // Quick decay
                    data[i] = (Math.random() * 2 - 1) * envelope * 0.3;
                }
                
                const source = audioContext.createBufferSource();
                const filter = audioContext.createBiquadFilter();
                const gainNode = audioContext.createGain();
                
                source.buffer = buffer;
                source.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, audioContext.currentTime);
                
                gainNode.gain.setValueAtTime(0.4, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                source.start(audioContext.currentTime);
            } catch (e) {
                console.log('Audio not supported');
            }
        }

                // Enhanced mobile touch event prevention
        function preventMobileRefresh() {
            // Prevent pull-to-refresh and zoom
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
            
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // Prevent pull-to-refresh specifically
            let lastTouchY = 0;
            document.addEventListener('touchstart', function(e) {
                lastTouchY = e.touches[0].clientY;
            });
            
            document.addEventListener('touchmove', function(e) {
                const touchY = e.touches[0].clientY;
                const touchYDelta = touchY - lastTouchY;
                lastTouchY = touchY;
                
                if (touchYDelta > 0 && window.scrollY === 0) {
                    e.preventDefault();
                }
            }, { passive: false });
        }

        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            const isMobile = document.body.classList.contains('mobile-version');
            const isWeb = document.body.classList.contains('web-version');
            const dpr = window.devicePixelRatio || 1;
            
            // Get actual container dimensions
            const containerWidth = container ? container.clientWidth : window.innerWidth;
            const containerHeight = container ? container.clientHeight : window.innerHeight;
            
            // Set canvas dimensions
            canvas.width = containerWidth * dpr;
            canvas.height = containerHeight * dpr;
            canvas.style.width = containerWidth + 'px';
            canvas.style.height = containerHeight + 'px';
            
            // Scale context for high-DPI displays
            ctx.scale(dpr, dpr);
            
            // Position rocket above options for mobile
            rocket.x = containerWidth / 2;
            const isMobileDevice = document.body.classList.contains('mobile-version');
            rocket.y = isMobileDevice ? (containerHeight * 0.45) : (containerHeight / 2); // Optimal position for mobile
            
            // Ensure canvas is visible
            canvas.style.display = 'block';
        }

        // Main game loop
        let lastTime = 0;
        function gameLoop(timestamp) {
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            update(deltaTime);
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameState = 'playing';
            game2Score = 0;
            resolving = false;
            
            // Position rocket properly for mobile - between question and options
            const canvasHeight = canvas.height / (window.devicePixelRatio || 1);
            const isMobileDevice = document.body.classList.contains('mobile-version');
            rocket.y = isMobileDevice ? (canvasHeight * 0.45) : (canvasHeight / 2);
            rocket.shake = 0;
            
            uiOverlay.style.display = 'none';
            qIndex = 0;
            loadQuestion();
        }

        function loadQuestion() {
            const t = topics[selectedTopic];
            const q = t.questions[nextIndex + qIndex];
            if (!q) { endGame(); return; }
            question.text = `Question ${qIndex + 1} of 3 · ${q.question}`;
            question.answer = q.answer;
            answers = q.options.slice(); // fixed order, no shuffle
        }

        function handleInput(event) {
            if (gameState !== 'playing') return;
            processInput(event.clientX, event.clientY);
        }

        function handleTouchInput(event) {
            if (gameState !== 'playing') return;
            event.preventDefault();
            event.stopPropagation();
            const touch = event.touches[0] || event.changedTouches[0];
            if (touch) {
                processInput(touch.clientX, touch.clientY);
            }
        }

        function processInput(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (clientX - rect.left) * scaleX / (window.devicePixelRatio || 1);
            const clickY = (clientY - rect.top) * scaleY / (window.devicePixelRatio || 1);
            
            const canvasWidth = canvas.width / (window.devicePixelRatio || 1);
            const canvasHeight = canvas.height / (window.devicePixelRatio || 1);
            
            // Enhanced mobile-responsive hit detection
            const isMobileDevice = document.body.classList.contains('mobile-version');
            const boxWidth = isMobileDevice ? Math.max(80, Math.min(90, canvasWidth / 4.5)) : answerBoxWidth;
            const boxHeight = isMobileDevice ? Math.max(50, Math.min(60, canvasHeight / 10)) : answerBoxHeight;
            const margin = isMobileDevice ? Math.max(6, canvasWidth / 50) : answerBoxMargin;
            
            const totalWidth = (boxWidth * 4) + (margin * 3);
            const startX = (canvasWidth - totalWidth) / 2;
            const boxY = canvasHeight - boxHeight - (isMobileDevice ? Math.max(100, canvasHeight / 6) : 40);

            answers.forEach((ans, index) => {
                const boxX = startX + index * (boxWidth + margin);
                if (clickX > boxX && clickX < boxX + boxWidth &&
                    clickY > boxY && clickY < boxY + boxHeight) {
                    
                    if (String(ans) === String(question.answer)) {
                        handleCorrectAnswer();
                    } else {
                        handleWrongAnswer();
                    }
                }
            });
        }

        function handleCorrectAnswer() {
            playCorrectChime();
            setTimeout(() => {
                playRocketLaunch();
            }, 200);
            gameState = 'launching';
            rocket.withFire = true;
            rocket.animFrame = 0;
        }

        function handleWrongAnswer() {
            playWrongBuzz();
            setTimeout(() => {
                playCrashThud();
            }, 300);
            gameState = 'crashing';
            rocket.withFire = false;
            rocket.animFrame = 0;
            rocket.fallingSpeed = 0;
            rocket.shake = 20;
            rocket.opacity = 1.0; // Start with full opacity
            rocket.fadeSpeed = 0.5; // Fade rate
        }

        function update(deltaTime) {
            switch (gameState) {
                case 'launching':
                    rocket.animFrame += deltaTime * 1.5;
                    rocket.y -= rocket.animFrame * 200 * deltaTime; // Faster upward movement
                    rocket.opacity = 1.0; // Ensure full opacity during launch
                    if (rocket.y < -rocket.h && !resolving) {
                        resolving = true;
                        // Count a correct and advance or finish
                        game2Score += 1;
                        gameState = 'transition';
                        proceedAfterAnswer(true);
                    }
                    break;
                case 'crashing':
                    if (rocket.animFrame < 1) {
                         // Initial upward bounce with fire effect
                        rocket.animFrame += deltaTime * 2;
                        rocket.y -= Math.sin(rocket.animFrame * Math.PI) * 50 * deltaTime;
                        rocket.withFire = true; // Show fire during crash
                    } else {
                        // Fade out and fall
                        rocket.withFire = false;
                        rocket.opacity -= rocket.fadeSpeed * deltaTime;
                        rocket.fallingSpeed += 9.8 * deltaTime * 8;
                        rocket.y += rocket.fallingSpeed * deltaTime;
                        
                        // Ensure opacity doesn't go below 0
                        if (rocket.opacity < 0) rocket.opacity = 0;
                    }
                    
                    const canvasHeight = canvas.height / (window.devicePixelRatio || 1);
                    if (rocket.y > canvasHeight + rocket.h && !resolving) {
                        resolving = true;
                        gameState = 'transition';
                        proceedAfterAnswer(false);
                    }
                    break;
                case 'playing':
                    if (rocket.shake > 0) {
                        rocket.shake -= deltaTime * 10;
                    }
                    break;
            }
        }

        function proceedAfterAnswer(correct) {
            // brief pause, then next or end
            const advance = () => setTimeout(() => {
                const canvasHeight = canvas.height / (window.devicePixelRatio || 1);
                const isMobileDevice = document.body.classList.contains('mobile-version');
                rocket.y = isMobileDevice ? (canvasHeight * 0.45) : (canvasHeight / 2);
                rocket.withFire = false;
                rocket.animFrame = 0;
                rocket.fallingSpeed = 0;
                rocket.shake = 0;
                rocket.opacity = 1.0; // Reset opacity
                rocket.fadeSpeed = 0;
                qIndex = Math.min(qCountGame2, qIndex + 1);
                if (qIndex >= qCountGame2) {
                    endGame();
                } else {
                    gameState = 'playing';
                    loadQuestion();
                    uiOverlay.style.display = 'none';
                }
                resolving = false;
            }, 500);
            if (selectedTopic === 'dynamic') window.AiplayFeedback.show(topics.dynamic.questions[nextIndex + qIndex], correct, advance);
            else advance();
        }

        function endGame() {
            // Save Rocket game score for next game
            sessionStorage.setItem('aiplay_game2Score', String(game2Score));
            window.saveAiplayGame?.('Rocket',game2Score,sessionStorage.getItem('aiplay_last_lesson') ? JSON.parse(sessionStorage.getItem('aiplay_last_lesson')).title : selectedTopic);

            window.location.href = 'game3.html';

        // Drawing functions
        function drawRocket(x, y, w, h, withFire) {
            ctx.save();
            ctx.globalAlpha = rocket.opacity || 1.0; // Apply opacity
            ctx.translate(x, y);

            if (rocket.shake > 0) {
                ctx.translate(Math.random() * rocket.shake - rocket.shake / 2, Math.random() * rocket.shake - rocket.shake / 2);
            }
            
            // Rocket body
            ctx.beginPath();
            ctx.moveTo(0, -h / 2); // Top point
            ctx.lineTo(w / 4, h / 2); // Right base
            ctx.lineTo(-w / 4, h / 2); // Left base
            ctx.closePath();
            ctx.fillStyle = "#A9A9A9"; // Dark Gray
            ctx.fill();

            // Cockpit Window
            ctx.beginPath();
            ctx.arc(0, -h / 4, 10, 0, Math.PI * 2);
            ctx.fillStyle = "#ADD8E6"; // Light Blue
            ctx.fill();

            // Fins
            ctx.beginPath();
            ctx.moveTo(w / 4, h / 2);
            ctx.lineTo(w / 4 + 15, h / 2 + 15);
            ctx.lineTo(w / 4 + 15, h / 2 + 5);
            ctx.closePath();
            ctx.fillStyle = "#808080"; // Gray
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-w / 4, h / 2);
            ctx.lineTo(-w / 4 - 15, h / 2 + 15);
            ctx.lineTo(-w / 4 - 15, h / 2 + 5);
            ctx.closePath();
            ctx.fillStyle = "#808080";
            ctx.fill();

            // Engine Flame
            if (withFire) {
                const flameHeight = Math.random() * 30 + 30;
                ctx.beginPath();
                ctx.moveTo(-w / 4, h / 2);
                ctx.lineTo(w / 4, h / 2);
                ctx.lineTo(0, h / 2 + flameHeight);
                ctx.closePath();
                const flameGradient = ctx.createLinearGradient(0, h / 2, 0, h / 2 + flameHeight);
                flameGradient.addColorStop(0, '#FF4500'); // Orange Red
                flameGradient.addColorStop(0.5, '#FFD700'); // Gold
                flameGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = flameGradient;
                ctx.fill();
            }

            ctx.restore();
        }


        function drawAnswers() {
            const canvasWidth = canvas.width / (window.devicePixelRatio || 1);
            const canvasHeight = canvas.height / (window.devicePixelRatio || 1);
            
            // Enhanced mobile detection and sizing
            const isMobile = document.body.classList.contains('mobile-version');
            const boxWidth = isMobile ? Math.max(80, Math.min(90, canvasWidth / 4.5)) : answerBoxWidth;
            const boxHeight = isMobile ? Math.max(50, Math.min(60, canvasHeight / 10)) : answerBoxHeight;
            const margin = isMobile ? Math.max(6, canvasWidth / 50) : answerBoxMargin;
            const fontSize = isMobile ? Math.max(14, Math.min(18, boxWidth / 5)) : 24;
            
            const totalWidth = (boxWidth * 4) + (margin * 3);
            const startX = (canvasWidth - totalWidth) / 2;
            const boxY = canvasHeight - boxHeight - (isMobile ? Math.max(120, canvasHeight / 5) : 40); // Even lower for mobile
            
            answers.forEach((ans, index) => {
                const boxX = startX + index * (boxWidth + margin);
                
                // Draw box
                ctx.fillStyle = gray;
                ctx.beginPath();
                ctx.roundRect(boxX, boxY, boxWidth, boxHeight, isMobile ? 6 : 10);
                ctx.fill();
                ctx.lineWidth = isMobile ? 1 : 2;
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.stroke();
                
                // Draw text with responsive font
                ctx.fillStyle = darkBlue;
                ctx.font = `${fontSize}px "Nunito"`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Handle long text on mobile
                const text = String(ans);
                let fittedSize = fontSize;
                while (ctx.measureText(text).width > boxWidth - 12 && fittedSize > 10) {
                    fittedSize -= 1;
                    ctx.font = `${fittedSize}px "Nunito"`;
                }
                ctx.fillText(text, boxX + boxWidth / 2, boxY + boxHeight / 2, boxWidth - 12);
            });
        }
        
        function draw() {
            const canvasWidth = canvas.width / (window.devicePixelRatio || 1);
            const canvasHeight = canvas.height / (window.devicePixelRatio || 1);
            
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            if (gameState !== 'start') {
                drawRocket(rocket.x, rocket.y, rocket.w, rocket.h, rocket.withFire);

                if (gameState === 'playing' || gameState === 'crashing') {
                    // Draw question text with enhanced mobile responsiveness
                    const isMobile = document.body.classList.contains('mobile-version');
                    const questionFontSize = isMobile ? Math.max(16, Math.min(20, canvasWidth / 25)) : 28;
                    const questionY = isMobile ? Math.max(40, canvasHeight / 15) : 80;
                    
                    ctx.font = `bold ${questionFontSize}px "Poppins"`;
                    ctx.fillStyle = white;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                    ctx.lineWidth = 2;
                    
                    // Always wrap by measured width, so a long question never leaves the screen.
                    const words = question.text.split(' '), lines=[]; let line=''; const maxWidth=canvasWidth*(isMobile?.88:.78);
                    words.forEach(word=>{const next=line?`${line} ${word}`:word;if(ctx.measureText(next).width>maxWidth&&line){lines.push(line);line=word;}else line=next;});
                    if(line)lines.push(line);
                    lines.slice(0,3).forEach((part,index)=>{const y=questionY+index*(questionFontSize+8);ctx.strokeText(part,canvasWidth/2,y,maxWidth);ctx.fillText(part,canvasWidth/2,y,maxWidth);});

                    drawAnswers();
                }
            }
        }

        // ENHANCED MOBILE DETECTION SYSTEM
        function detectMobileDevice() {
            const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const isSmallScreen = window.innerWidth <= 768;
            const isPortrait = window.innerHeight > window.innerWidth;
            const isMobileScreen = window.innerWidth < 1024; // More accurate mobile detection
            
            return {
                isMobile: isMobileUA || (isTouchDevice && isSmallScreen) || isMobileScreen,
                isTouch: isTouchDevice,
                isPortrait: isPortrait,
                screenWidth: window.innerWidth,
                screenHeight: window.innerHeight,
                deviceType: isMobileUA || isMobileScreen ? 'mobile' : 'desktop'
            };
        }

        // AUTO-APPLY MOBILE VERSION
        function initializeMobileOptimization() {
            const deviceInfo = detectMobileDevice();
            
            // Always auto-detect and apply appropriate version
            if (deviceInfo.isMobile) {
                document.body.classList.add('mobile-version', 'mobile-detected');
                console.log('Mobile device detected - applying mobile full-screen version');
            } else {
                document.body.classList.add('web-version');
                console.log('Desktop device detected - applying web version');
            }
            
            // Trigger canvas resize after version is set
            setTimeout(() => {
                resizeCanvas();
            }, 100);
        }

                backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.3);
            `;
            
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 2000);
        }

        // AUTO-INITIALIZE ON PAGE LOAD
        document.addEventListener('DOMContentLoaded', function() {
            initializeMobileOptimization();
            adjustCanvasForMobile();
            
            // Initialize canvas and rocket after mobile detection
            setTimeout(() => {
                resizeCanvas();
                if (typeof draw === 'function') {
                    draw(); // Initial draw to show rocket
                }
            }, 100);
        });

        // RESPONSIVE CANVAS ADJUSTMENT
        function adjustCanvasForMobile() {
            const deviceInfo = detectMobileDevice();
            if (deviceInfo.isMobile && document.body.classList.contains('mobile-version')) {
                resizeCanvas();
            }
        }

        // WINDOW RESIZE HANDLER
        window.addEventListener('resize', function() {
            adjustCanvasForMobile();
        });

    </script>
<script src="auth.js"></script><script src="activity-tracker.js"></script></body>
