services:
  - type: web
    name: personal-education-agents
    runtime: node
    plan: free
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
