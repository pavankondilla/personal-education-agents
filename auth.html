<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Aiplay</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><main class="auth-card"><a href="index.html" class="account-link">← Aiplay</a><p>YOUR PRIVATE STUDY SPACE</p><h1 id="title">Welcome back.</h1><p id="intro">Sign in to keep your lessons, questions, and game progress together.</p><form id="form" class="auth-form"><label id="nameField" hidden>Your name<input id="name" maxlength="60" autocomplete="name"></label><label>Gmail or email address<input id="email" type="email" autocomplete="email" required placeholder="you@gmail.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters"></label><button class="auth-submit" id="submit">Sign in</button><p class="auth-error" id="error" role="alert"></p></form><p><span id="switchText">New here?</span> <button class="auth-switch" id="switch" type="button">Create an account</button></p></main><script src="auth.js"></script><script>let registering=false;const $=s=>document.querySelector(s);$('#switch').onclick=()=>{registering=!registering;$('#nameField').hidden=!registering;$('#title').textContent=registering?'Create your study space.':'Welcome back.';$('#intro').textContent=registering?'Your learning history stays private to your account.':'Sign in to keep your lessons, questions, and game progress together.';$('#submit').textContent=registering?'Create account':'Sign in';$('#switchText').textContent=registering?'Already have an account?':'New here?';$('#switch').textContent=registering?'Sign in':'Create an account';$('#password').autocomplete=registering?'new-password':'current-password';$('#error').textContent=''};$('#form').onsubmit=async e=>{e.preventDefault();$('#error').textContent='';try{const email=$('#email').value.trim(),password=$('#password').value;if(registering)await aiplayAuth.request('/api/auth/register',{method:'POST',body:JSON.stringify({name:$('#name').value.trim(),email,password})});else await aiplayAuth.request('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})});location.href='dashboard.html'}catch(error){$('#error').textContent=error.message}};</script></body></html>
