<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My learning dashboard | Aiplay</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"></head><body class="dashboard-page"><main class="dashboard"><header class="dashboard-header"><div><a href="index.html" class="account-link">← Study studio</a><p>YOUR LEARNING DASHBOARD</p><h1 id="greeting">Your progress</h1><p id="summary">Your learning activity will appear here.</p></div><div data-auth-nav></div></header><section class="dash-grid"><article class="metric"><span>Lessons explored</span><strong id="lessons">0</strong></article><article class="metric"><span>Questions for Mira</span><strong id="chats">0</strong></article><article class="metric"><span>Game rounds</span><strong id="games">0</strong></article><article class="metric"><span>Answer accuracy</span><strong id="accuracy">—</strong></article></section><section class="dashboard-columns"><article class="panel"><small>TOPICS YOU’RE RETURNING TO</small><div id="topics"></div></article><article class="panel"><small>RECENT LEARNING</small><div id="recent"></div></article></section></main><script src="auth.js"></script><script>document.addEventListener('aiplay:auth',async e=>{if(!e.detail){location.href='auth.html';return}const d=await aiplayAuth.request('/api/dashboard');document.querySelector('#greeting').textContent=`${e.detail.name.split(' ')[0]}’s progress`;document.querySelector('#summary').textContent=d.questions?`${d.correct} correct answers out of ${d.questions} tracked questions.`:'Start a lesson or a recall game and your progress will show here.';for(const k of ['lessons','chats','games'])document.querySelector('#'+k).textContent=d[k];document.querySelector('#accuracy').textContent=d.questions?`${d.accuracy}%`:'—';document.querySelector('#topics').innerHTML=d.topics.length?d.topics.map(x=>`<div class="topic-row"><span>${escapeHtml(x.topic)}</span><b>${x.sessions} lesson${x.sessions===1?'':'s'}</b></div>`).join(''):'<p class="empty">No lessons saved yet.</p>';document.querySelector('#recent').innerHTML=d.recent.length?d.recent.map(x=>`<div class="activity-row"><b>${escapeHtml(x.topic)}</b><br><small>${x.type} · ${new Date(x.createdAt).toLocaleDateString()}</small></div>`).join(''):'<p class="empty">Your recent activity will appear here.</p>'});function escapeHtml(s){const x=document.createElement('div');x.textContent=s;return x.innerHTML}</script></body></html>
