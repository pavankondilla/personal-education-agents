services:
  - type: web
    name: personal-education-agents
    runtime: node
    plan: free
    buildCommand: npm ci && npm run check
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_API_KEY_2
        sync: false
      - key: GROK_API_KEY_3
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: NODE_ENV
        value: production
